name: Deploy NovaClip AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # 移除 cache: 'npm'，因为需要package-lock.json才能缓存
    
    - name: Install dependencies
      run: |
        echo "Installing dependencies without lock file..."
        npm install --no-package-lock  # 强制不生成package-lock.json
    
    - name: Type check
      run: npm run lint
      continue-on-error: true  # 类型检查失败不影响部署
    
    - name: Build project
      run: npm run build
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        force_orphan: true
